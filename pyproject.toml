[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
extend-exclude = [".reference", ".tools", ".work", ".specify", "jailbreak/gpt6-Astra", "jailbreak/local"]
cache-dir = ".tools/ruff-cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
