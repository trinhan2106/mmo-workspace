name: Project workflow checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  project-state:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r project/quality-requirements.txt
      - run: ruff check scripts tests
      - run: ruff format --check scripts tests
      - run: npx --yes --package prettier@3.9.10 prettier --check scripts/bypass.cjs scripts/bypass/paths.cjs scripts/bypass/upstream.cjs tests/bypass.test.cjs
      - run: node --test tests/bypass.test.cjs
      - run: node scripts/bypass.cjs check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/project.py check
